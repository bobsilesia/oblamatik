name: Release Body Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to update (e.g., v4.0.9)'
        required: false
        default: 'v4.0.9'

permissions:
  contents: write

jobs:
  update-release-body:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Extract notes from CHANGELOG for tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_REPO="${{ github.repository }}"
          TAG_INPUT="${{ inputs.tag }}"
          if [ -n "${TAG_INPUT}" ]; then
            TAG="${TAG_INPUT}"
          else
            TAG=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${OWNER_REPO}/releases/latest" | jq -r '.tag_name')
          fi
          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "No tag from API, falling back to topmost header in CHANGELOG"
            TAG=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## //')
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "TAG=${TAG}"
          echo "HEAD of CHANGELOG.md:"
          head -n 15 CHANGELOG.md || true
          START_LINE=$(awk -v ver="${TAG}" 'BEGIN{n=0} {n++; if($0=="## " ver){print n; exit}}' CHANGELOG.md)
          if [ -z "${START_LINE}" ]; then
            ALT_VER=$(echo "${TAG}" | sed 's/^v//')
            echo "Primary match failed, trying without 'v' prefix: ${ALT_VER}"
            START_LINE=$(awk -v ver="${ALT_VER}" 'BEGIN{n=0} {n++; if($0=="## " ver){print n; exit}}' CHANGELOG.md)
          fi
          if [ -z "${START_LINE}" ]; then
            echo "Header for ${TAG} not found in CHANGELOG.md"
            exit 1
          fi
          END_LINE=$(awk -v s="${START_LINE}" 'BEGIN{n=0; found=0} {n++; if(n>s && $0 ~ /^## /){print n-1; found=1; exit}} END{if(found==0) print n}' CHANGELOG.md)
          START=$((START_LINE + 1))
          sed -n "${START},${END_LINE}p" CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No extracted notes for ${TAG} in CHANGELOG.md"
            exit 1
          fi
          echo "Tag: ${TAG}"
          echo "Start: ${START_LINE}, End: ${END_LINE}"
          echo "Extracted notes:"
          cat RELEASE_NOTES.md

      - name: Update GitHub Release body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OWNER_REPO="${{ github.repository }}"
          TAG_INPUT="${{ inputs.tag }}"
          TAG="${TAG_INPUT}"
          if [ -z "${TAG}" ]; then
            TAG="${TAG}"
          fi
          if [ -z "${TAG}" ]; then
            TAG=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${OWNER_REPO}/releases/latest" | jq -r '.tag_name')
          fi
          REL_JSON=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${OWNER_REPO}/releases/tags/${TAG}")
          REL_ID=$(echo "${REL_JSON}" | jq -r '.id')
          if [ -z "${REL_ID}" ] || [ "${REL_ID}" = "null" ]; then
            echo "Release not found for tag ${TAG}"
            exit 1
          fi
          BODY=$(jq -Rs . < RELEASE_NOTES.md)
          PATCH_PAYLOAD="{\"body\": ${BODY}}"
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER_REPO}/releases/${REL_ID}" \
            -d "${PATCH_PAYLOAD}"
