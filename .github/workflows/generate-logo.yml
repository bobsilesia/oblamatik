name: Generate Brand Assets
on:
  workflow_dispatch:
  push:
    paths:
      - assets/fonts/EBGaramond.ttf
      - .github/workflows/generate-logo.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install pillow

      - name: Generate Logos
        run: |
          python3 - << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          def create_text_image(text, font_path, font_size, color):
              try:
                  font = ImageFont.truetype(font_path, font_size)
              except IOError as e:
                  print(f"Could not load font from {font_path}: {e}")
                  return None

              # Calculate text size using a dummy image
              dummy_img = Image.new('RGBA', (1, 1), (0, 0, 0, 0))
              draw = ImageDraw.Draw(dummy_img)
              bbox = draw.textbbox((0, 0), text, font=font)
              text_width = bbox[2] - bbox[0]
              text_height = bbox[3] - bbox[1]

              # Create image with padding
              padding = 20
              img_width = text_width + (padding * 2)
              img_height = text_height + (padding * 2)
              
              img = Image.new('RGBA', (img_width, img_height), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              
              # Draw text centered
              text_x = padding - bbox[0]
              text_y = padding - bbox[1]
              draw.text((text_x, text_y), text, font=font, fill=color)
              
              return img

          def main():
              base_dir = os.getcwd()
              font_path = os.path.join(base_dir, "assets", "fonts", "EBGaramond.ttf")
              
              if not os.path.exists(font_path):
                  print(f"Font file not found: {font_path}")
                  exit(1)

              # Output directories
              brand_dir = os.path.join(base_dir, "custom_components", "oblamatik", "brand")
              root_dir = base_dir
              
              os.makedirs(brand_dir, exist_ok=True)
              
              # Light gray color
              text_color = (200, 200, 200, 255) # Light Gray
              
              # Generate @2x logo (High Res)
              print(f"Generating logo@2x.png using font: {font_path}")
              logo_2x = create_text_image("Oblamatik", font_path, 200, text_color)
              
              if logo_2x:
                  # Save to brand/
                  logo_2x_path = os.path.join(brand_dir, "logo@2x.png")
                  logo_2x.save(logo_2x_path)
                  print(f"Saved {logo_2x_path}")
                  
                  # Save to root/
                  root_logo_2x_path = os.path.join(root_dir, "logo@2x.png")
                  logo_2x.save(root_logo_2x_path)
                  print(f"Saved {root_logo_2x_path}")
                  
                  # Generate standard logo (Resized)
                  print("Generating logo.png...")
                  target_width = logo_2x.width // 2
                  target_height = logo_2x.height // 2
                  logo = logo_2x.resize((target_width, target_height), Image.Resampling.LANCZOS)
                  
                  # Save to brand/
                  logo_path = os.path.join(brand_dir, "logo.png")
                  logo.save(logo_path)
                  print(f"Saved {logo_path}")

                  # Save to root/
                  root_logo_path = os.path.join(root_dir, "logo.png")
                  logo.save(root_logo_path)
                  print(f"Saved {root_logo_path}")

          if __name__ == "__main__":
              main()
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check for changes
          if [[ -n $(git status -s) ]]; then
            git add custom_components/oblamatik/brand/logo*.png logo*.png
            git commit -m "chore: update brand logos (Garamond Light Gray)"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No changes to commit"
          fi
