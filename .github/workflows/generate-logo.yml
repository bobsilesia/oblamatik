name: Generate Logo
on:
  workflow_dispatch:
  push:
    paths:
      - logo.svg
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y fonts-ebgaramond imagemagick
      - name: Generate PNGs
        run: |
          magick -size 640x160 canvas:#f2ede6 \( -size 640x160 granite: -alpha set -channel A -evaluate Set 15% +channel \) -compose overlay -composite -gravity center -font EBGaramond-Regular -pointsize 128 -fill "#2b1f17" -annotate +0+0 "Oblamatik" logo.png
          magick -size 1280x320 canvas:#f2ede6 \( -size 1280x320 granite: -alpha set -channel A -evaluate Set 15% +channel \) -compose overlay -composite -gravity center -font EBGaramond-Regular -pointsize 256 -fill "#2b1f17" -annotate +0+0 "Oblamatik" logo@2x.png
      - name: Commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add logo.png logo@2x.png
            git commit -m "chore: regenerate logo assets (Garamond style)"
            git push
          fi
