name: Generate Logo
on:
  workflow_dispatch:
  push:
    paths:
      - logo.svg
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - name: Install Python and font (Cinzel)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow
          curl -L -o Cinzel-Regular.ttf https://github.com/google/fonts/raw/main/ofl/cinzel/static/Cinzel-Regular.ttf
      - name: Generate PNGs (Pillow)
        run: |
          python3 - << 'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import math, random
          def radial_bg(w, h):
              base = Image.new("RGB", (w, h), (0x1b,0x2a,0x3c))
              grad = Image.new("RGB", (w, h))
              cx, cy = w/2, h/2
              maxr = math.hypot(cx, cy)
              px = grad.load()
              for y in range(h):
                  for x in range(w):
                      r = math.hypot(x-cx, y-cy)/maxr
                      a = min(1.0, r)
                      c1 = (0x33,0x49,0x62); c2 = (0x0d,0x14,0x20)
                      px[x,y] = tuple(int(c1[i]*(1-a) + c2[i]*a) for i in range(3))
              out = Image.blend(base, grad, 0.6)
              noise = Image.new("L", (w, h))
              npx = noise.load()
              for y in range(h):
                  for x in range(w):
                      npx[x,y] = random.randint(0, 40)
              noise = noise.filter(ImageFilter.GaussianBlur(0.6))
              out = Image.composite(out, Image.merge("RGB",(noise,noise,noise)), Image.new("L",(w,h),45))
              vign = Image.new("L",(w,h),0)
              vpx = vign.load(); cx, cy = w/2, h/2; maxr = math.hypot(cx, cy)
              for y in range(h):
                  for x in range(w):
                      r = math.hypot(x-cx, y-cy)/maxr
                      v = int(255*min(max((r-0.5)*1.6,0),1))
                      vpx[x,y]=v
              out = Image.composite(out, Image.new("RGB",(w,h),(0,0,0)), vign)
              return out.convert("RGBA")
          def render(w,h,outname,fontpath):
              img = radial_bg(w,h)
              draw = ImageDraw.Draw(img)
              text = "OBLAMATIK"
              lo, hi = 10, 400; best=10
              while lo<=hi:
                  mid=(lo+hi)//2
                  f=ImageFont.truetype(fontpath, mid)
                  tw, th = draw.textbbox((0,0), text, font=f)[2:]
                  if tw<=int(w*0.86) and th<=int(h*0.72):
                      best=mid; lo=mid+1
                  else:
                      hi=mid-1
              f=ImageFont.truetype(fontpath, best)
              tw, th = draw.textbbox((0,0), text, font=f)[2:]
              x=(w-tw)//2; y=(h-th)//2
              shadow = Image.new("RGBA",(w,h),(0,0,0,0))
              sd = ImageDraw.Draw(shadow)
              sd.text((x+2,y+4), text, font=f, fill=(0,0,0,140))
              shadow = shadow.filter(ImageFilter.GaussianBlur(2))
              img = Image.alpha_composite(img, shadow)
              draw = ImageDraw.Draw(img)
              draw.text((x,y), text, font=f, fill=(0xCF,0xD3,0xD8,255))
              img.save(outname)
          render(640,160,"logo.png","Cinzel-Regular.ttf")
          render(1280,320,"logo@2x.png","Cinzel-Regular.ttf")
          PY
      - name: Commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add logo.png logo@2x.png
            git commit -m "chore: regenerate logo assets (Garamond style)"
            git push
          fi
