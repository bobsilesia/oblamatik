name: Generate Logo
on:
  workflow_dispatch:
  push:
    paths:
      - logo.svg
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - name: Install ImageMagick and fonts
        run: |
          set -e
          sudo apt-get install -y imagemagick fontconfig || true
          # Try distro fonts first
          sudo apt-get install -y fonts-eb-garamond fonts-cinzel || true
          # Fallback: download TTFs from Google Fonts and cache locally
          mkdir -p "$RUNNER_TEMP/fonts"
          if ! fc-list | grep -qi 'Cinzel'; then
            curl -L -o "$RUNNER_TEMP/fonts/Cinzel-Regular.ttf" https://github.com/google/fonts/raw/main/ofl/cinzel/static/Cinzel-Regular.ttf || true
          fi
          if ! fc-list | grep -qi 'EBGaramond'; then
            curl -L -o "$RUNNER_TEMP/fonts/EBGaramond-Regular.ttf" https://github.com/google/fonts/raw/main/ofl/ebgaramond/static/EBGaramond-Regular.ttf || true
          fi
          if ls "$RUNNER_TEMP/fonts"/*.ttf >/dev/null 2>&1; then
            mkdir -p ~/.local/share/fonts
            cp "$RUNNER_TEMP/fonts"/*.ttf ~/.local/share/fonts/ || true
            fc-cache -f -v || true
          fi
      - name: Generate PNGs
        run: |
          set -e
          # Prefer Cinzel to mimic the reference; fallback to EB Garamond
          FONT_PATH="$(fc-list | grep -i -m1 'Cinzel[^-]*-Regular' | awk -F: '{print $1}')"
          if [ -z "$FONT_PATH" ]; then
            FONT_PATH="$(fc-list | grep -i -m1 'EBGaramond[^-]*-Regular' | awk -F: '{print $1}')"
          fi
          echo "Using font: $FONT_PATH"
          TEXT="OBLAMATIK"
          # @1x (640x160)
          convert -size 640x160 radial-gradient:'#1b2a3c-#0d1420' \
            \( -size 640x160 granite: -alpha set -channel A -evaluate set 18% +channel \) \
            -compose overlay -composite \
            -blur 0x0.4 -vignette 0x28 bg_1x.png
          # Shadow
          convert -size 640x160 xc:none -font "$FONT_PATH" -pointsize 130 -gravity center \
            -fill black -annotate +1+2 "$TEXT" -alpha set -channel A -evaluate set 35% +channel \
            -blur 0x1 shadow_1x.png
          # Main text (light grey for metallic look)
          convert bg_1x.png shadow_1x.png \
            \( -size 640x160 xc:none -font "$FONT_PATH" -pointsize 130 -gravity center -fill '#cfd3d8' -annotate +0+0 "$TEXT" \) \
            -compose over -composite -compose over -composite logo.png
          rm -f bg_1x.png shadow_1x.png
          # @2x (1280x320)
          convert -size 1280x320 radial-gradient:'#1b2a3c-#0d1420' \
            \( -size 1280x320 granite: -alpha set -channel A -evaluate set 18% +channel \) \
            -compose overlay -composite \
            -blur 0x0.6 -vignette 0x40 bg_2x.png
          convert -size 1280x320 xc:none -font "$FONT_PATH" -pointsize 260 -gravity center \
            -fill black -annotate +2+4 "$TEXT" -alpha set -channel A -evaluate set 35% +channel \
            -blur 0x2 shadow_2x.png
          convert bg_2x.png shadow_2x.png \
            \( -size 1280x320 xc:none -font "$FONT_PATH" -pointsize 260 -gravity center -fill '#cfd3d8' -annotate +0+0 "$TEXT" \) \
            -compose over -composite -compose over -composite logo@2x.png
          rm -f bg_2x.png shadow_2x.png
      - name: Commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add logo.png logo@2x.png
            git commit -m "chore: regenerate logo assets (Garamond style)"
            git push
          fi
