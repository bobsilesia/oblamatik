name: Generate Logo
on:
  workflow_dispatch:
  push:
    paths:
      - logo.svg
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - name: Install ImageMagick and fonts
        run: |
          set -euo pipefail
          sudo apt-get install -y imagemagick fontconfig fonts-dejavu-core || true
          # Try distro fonts first (names vary between distros)
          sudo apt-get install -y fonts-ebgaramond fonts-eb-garamond fonts-cinzel || true
          # Fallback: download TTFs from Google Fonts and cache locally
          mkdir -p "$RUNNER_TEMP/fonts"
          if ! fc-list | grep -qi 'Cinzel'; then
            curl -L -o "$RUNNER_TEMP/fonts/Cinzel-Regular.ttf" https://github.com/google/fonts/raw/main/ofl/cinzel/static/Cinzel-Regular.ttf || true
          fi
          if ! fc-list | grep -qi 'EBGaramond'; then
            curl -L -o "$RUNNER_TEMP/fonts/EBGaramond-Regular.ttf" https://github.com/google/fonts/raw/main/ofl/ebgaramond/static/EBGaramond-Regular.ttf || true
          fi
          if ls "$RUNNER_TEMP/fonts"/*.ttf >/dev/null 2>&1; then
            mkdir -p ~/.local/share/fonts
            cp "$RUNNER_TEMP/fonts"/*.ttf ~/.local/share/fonts/ || true
            fc-cache -f -v || true
          fi
      - name: Generate PNGs
        run: |
          set -euo pipefail
          set -x
          # Prefer Cinzel/EB Garamond by family name (safer than direct TTF path with IM6)
          FONT_NAME="$(fc-list : family | grep -i -m1 '^Cinzel' || true)"
          if [ -z "$FONT_NAME" ]; then
            FONT_NAME="$(fc-list : family | grep -i -m1 '^EB Garamond' || true)"
          fi
          if [ -z "$FONT_NAME" ]; then
            FONT_NAME="$(fc-list : family | grep -i -m1 '^DejaVu Serif' || true)"
          fi
          if [ -z "$FONT_NAME" ]; then
            FONT_NAME="DejaVu Serif"
          fi
          echo "Using font family: $FONT_NAME"
          TEXT="OBLAMATIK"
          # @1x (640x160) — create background step by step for reliability
          convert -size 640x160 xc:'#1b2a3c' bg_1x.png
          convert -size 640x160 radial-gradient:'#334962-#0d1420' grad_1x.png
          composite -compose overlay grad_1x.png bg_1x.png bg_1x.png
          convert -size 640x160 granite: granite_1x.png
          convert granite_1x.png -alpha set -channel A -evaluate set 18% +channel granite_1x.png
          composite -compose overlay granite_1x.png bg_1x.png bg_1x.png
          mogrify -blur 0x0.6 -vignette 0x28 bg_1x.png
          # Shadow
          if ! convert -size 640x160 xc:none -font "$FONT_NAME" -pointsize 130 -gravity center \
               -fill black -annotate +1+2 "$TEXT" -alpha set -channel A -evaluate set 35% +channel \
               -blur 0x1 shadow_1x.png ; then
            convert -size 640x160 xc:none -font "DejaVu Serif" -pointsize 130 -gravity center \
               -fill black -annotate +1+2 "$TEXT" -alpha set -channel A -evaluate set 35% +channel \
               -blur 0x1 shadow_1x.png
          fi
          # Main text (light grey for metallic look)
          if ! convert bg_1x.png shadow_1x.png \
               \( -size 640x160 xc:none -font "$FONT_NAME" -pointsize 130 -gravity center -fill '#cfd3d8' -annotate +0+0 "$TEXT" \) \
               -compose over -composite -compose over -composite logo.png ; then
            convert bg_1x.png shadow_1x.png \
               \( -size 640x160 xc:none -font "DejaVu Serif" -pointsize 130 -gravity center -fill '#cfd3d8' -annotate +0+0 "$TEXT" \) \
               -compose over -composite -compose over -composite logo.png
          fi
          rm -f bg_1x.png shadow_1x.png
          # @2x (1280x320)
          convert -size 1280x320 xc:'#1b2a3c' bg_2x.png
          convert -size 1280x320 radial-gradient:'#334962-#0d1420' grad_2x.png
          composite -compose overlay grad_2x.png bg_2x.png bg_2x.png
          convert -size 1280x320 granite: granite_2x.png
          convert granite_2x.png -alpha set -channel A -evaluate set 18% +channel granite_2x.png
          composite -compose overlay granite_2x.png bg_2x.png bg_2x.png
          mogrify -blur 0x0.8 -vignette 0x40 bg_2x.png
          if ! convert -size 1280x320 xc:none -font "$FONT_NAME" -pointsize 260 -gravity center \
               -fill black -annotate +2+4 "$TEXT" -alpha set -channel A -evaluate set 35% +channel \
               -blur 0x2 shadow_2x.png ; then
            convert -size 1280x320 xc:none -font "DejaVu Serif" -pointsize 260 -gravity center \
               -fill black -annotate +2+4 "$TEXT" -alpha set -channel A -evaluate set 35% +channel \
               -blur 0x2 shadow_2x.png
          fi
          if ! convert bg_2x.png shadow_2x.png \
               \( -size 1280x320 xc:none -font "$FONT_NAME" -pointsize 260 -gravity center -fill '#cfd3d8' -annotate +0+0 "$TEXT" \) \
               -compose over -composite -compose over -composite logo@2x.png ; then
            convert bg_2x.png shadow_2x.png \
               \( -size 1280x320 xc:none -font "DejaVu Serif" -pointsize 260 -gravity center -fill '#cfd3d8' -annotate +0+0 "$TEXT" \) \
               -compose over -composite -compose over -composite logo@2x.png
          fi
          rm -f bg_2x.png shadow_2x.png grad_1x.png grad_2x.png granite_1x.png granite_2x.png
      - name: Commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add logo.png logo@2x.png
            git commit -m "chore: regenerate logo assets (Garamond style)"
            git push
          fi
