name: Replace Logo From URL
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Public URL do obrazu z logo (PNG/JPG)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install pillow
      - name: Download image
        run: |
          set -euo pipefail
          curl -fL "${{ inputs.image_url }}" -o _source_logo
          file _source_logo || true
      - name: Generate logo assets
        run: |
          python - << 'PY'
          from PIL import Image, ImageFilter
          import sys
          src = "_source_logo"
          # Target sizes
          targets = [(640,160,"logo.png"), (1280,320,"logo@2x.png")]
          with Image.open(src) as im:
              im = im.convert("RGBA")
              for w,h,outname in targets:
                  iw, ih = im.size
                  # 1) FIT: skaluj tak, by cala grafika zmiescila sie w docelowym rozmiarze (bez kadrowania)
                  scale_fit = min(w/iw, h/ih)
                  fit_w, fit_h = max(1, int(iw*scale_fit)), max(1, int(ih*scale_fit))
                  img_fit = im.resize((fit_w, fit_h), Image.LANCZOS)
                  # 2) TLO: stworz rozmyte tlo z obrazu skalowanego metodą COVER (zachowujemy styl i kolory)
                  scale_cover = max(w/iw, h/ih)
                  cov_w, cov_h = max(1, int(iw*scale_cover)), max(1, int(ih*scale_cover))
                  bg = im.resize((cov_w, cov_h), Image.LANCZOS)
                  # wytnij centralnie do wymiaru docelowego
                  left = max(0, (cov_w - w)//2)
                  top = max(0, (cov_h - h)//2)
                  bg = bg.crop((left, top, left+w, top+h)).convert("RGBA")
                  # rozmycie i lekkie przyciemnienie na krawedziach
                  bg = bg.filter(ImageFilter.GaussianBlur(12))
                  overlay = Image.new("RGBA", (w,h), (0,0,0,80))
                  bg = Image.alpha_composite(bg, overlay)
                  # 3) Zloz: wklej dopasowany obraz centralnie na tle
                  canvas = bg.copy()
                  x = (w - fit_w)//2
                  y = (h - fit_h)//2
                  canvas.paste(img_fit, (x, y), img_fit)
                  # 4) Delikatne wyostrzenie
                  canvas = canvas.filter(ImageFilter.UnsharpMask(radius=0.5, percent=120, threshold=2))
                  canvas.save(outname)
          PY
      - name: Commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add logo.png logo@2x.png
            git commit -m "chore: replace logo from URL via workflow"
            git push
          fi
