name: Replace Logo From URL
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Public URL do obrazu z logo (PNG/JPG)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install pillow
      - name: Download image
        run: |
          set -euo pipefail
          curl -fL "${{ inputs.image_url }}" -o _source_logo
          file _source_logo || true
      - name: Generate logo assets
        run: |
          python - << 'PY'
          from PIL import Image, ImageFilter
          import sys
          src = "_source_logo"
          # Target sizes
          targets = [(640,160,"logo.png"), (1280,320,"logo@2x.png")]
          with Image.open(src) as im:
              im = im.convert("RGBA")
              for w,h,outname in targets:
                  # Wyrównaj do docelowych proporcji 4:1 (centrowany crop z zachowaniem tła)
                  target_ratio = w/h
                  iw, ih = im.size
                  ratio = iw/ih
                  img = im.copy()
                  if ratio > target_ratio:
                      # Zbyt szerokie -> przytnij boki
                      new_w = int(ih*target_ratio)
                      left = (iw - new_w)//2
                      img = img.crop((left, 0, left+new_w, ih))
                  elif ratio < target_ratio:
                      # Zbyt wysokie -> przytnij góra/dół
                      new_h = int(iw/target_ratio)
                      top = (ih - new_h)//2
                      img = img.crop((0, top, iw, top+new_h))
                  img = img.resize((w,h), Image.LANCZOS)
                  # Delikatne wyostrzenie po skalowaniu
                  img = img.filter(ImageFilter.UnsharpMask(radius=0.5, percent=120, threshold=2))
                  img.save(outname)
          PY
      - name: Commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add logo.png logo@2x.png
            git commit -m "chore: replace logo from URL via workflow"
            git push
          fi
