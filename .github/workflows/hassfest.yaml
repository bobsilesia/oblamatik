name: Hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Hassfest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
